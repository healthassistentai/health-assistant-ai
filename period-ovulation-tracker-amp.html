<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Period & Ovulation Tracker</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html, body{ margin:0; padding:0; background:transparent; }
#pot-root, #pot-root *{
  box-sizing:border-box; margin:0; padding:0; list-style:none; text-align:left;
}
#pot-root{
  --pot-ink:#3A1F2B; --pot-paper:#FBF1F0; --pot-card:#FFFFFF; --pot-line:#EBD3D6;
  --pot-rose:#B4485B; --pot-rose-dark:#7E2E3C; --pot-plum:#5B3A52;
  --pot-fertile:#3E8067; --pot-fertile-bg:#E4F1EA; --pot-ovulation:#B4485B;
  --pot-period:#C24B3F; --pot-period-bg:#FBE9E6; --pot-neutral:#E7DCDD;
  font-family:'IBM Plex Sans','Noto Sans Bengali','Noto Sans Devanagari','Segoe UI',sans-serif;
  color:var(--pot-ink); background:var(--pot-paper);
  max-width:860px; margin:0 auto; padding:28px 20px 40px;
  border:1px solid var(--pot-line); border-radius:14px;
}
#pot-root .pot-eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--pot-rose); font-weight:600; margin-bottom:6px; }
#pot-root h1{ font-family:'Fraunces','Noto Sans Bengali','Noto Sans Devanagari', serif; font-weight:600; font-size:28px; margin:0 0 6px; color:var(--pot-rose-dark); line-height:1.2; }
#pot-root .pot-sub{ font-size:14.5px; color:#6B4A54; margin:0 0 18px; line-height:1.5; }
#pot-root .pot-langbar{ display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
#pot-root .pot-lang-btn{ border:1px solid var(--pot-line); background:var(--pot-card); color:var(--pot-ink); padding:6px 14px; border-radius:999px; font-size:13px; cursor:pointer; font-weight:600; }
#pot-root .pot-lang-btn.active{ background:var(--pot-rose); border-color:var(--pot-rose); color:#fff; }
#pot-root .pot-card{ background:var(--pot-card); border:1px solid var(--pot-line); border-radius:12px; padding:20px; margin-bottom:18px; }
#pot-root .pot-field{ margin-bottom:14px; }
#pot-root label{ display:block; font-size:13px; font-weight:600; color:var(--pot-plum); margin-bottom:6px; }
#pot-root input{ width:100%; padding:10px 12px; border:1px solid var(--pot-line); border-radius:8px; font-size:14.5px; color:var(--pot-ink); background:#FEFAFA; }
#pot-root input:focus{ outline:2px solid var(--pot-rose); outline-offset:1px; }
#pot-root .pot-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
#pot-root .pot-btn{ border:none; border-radius:8px; padding:11px 20px; font-size:14.5px; font-weight:600; cursor:pointer; background:var(--pot-rose); color:#fff; margin-top:4px; }
#pot-root .pot-btn:hover{ background:var(--pot-rose-dark); }
#pot-root .pot-msg{ display:none; font-size:13px; color:var(--pot-rose-dark); background:#FBE9E6; border:1px solid var(--pot-line); border-radius:8px; padding:10px 12px; margin-top:10px; }
#pot-root .pot-disclaimer{ font-size:12.5px; color:#5A4048; background:#F3E4E4; border:1px solid var(--pot-line); border-left:4px solid var(--pot-rose); border-radius:8px; padding:12px 14px; margin-bottom:18px; line-height:1.55; }
#pot-root .pot-results{ display:none; }
#pot-root .pot-results.show{ display:block; }
#pot-root .pot-stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
#pot-root .pot-stat{ background:var(--pot-card); border:1px solid var(--pot-line); border-radius:12px; padding:16px; border-top:4px solid var(--pot-rose); }
#pot-root .pot-stat.fertile{ border-top-color:var(--pot-fertile); }
#pot-root .pot-stat.ovulation{ border-top-color:var(--pot-ovulation); }
#pot-root .pot-stat-label{ font-size:12px; color:#6B4A54; font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
#pot-root .pot-stat-value{ font-family:'Fraunces','Noto Sans Bengali','Noto Sans Devanagari', serif; font-size:17px; font-weight:600; color:var(--pot-rose-dark); line-height:1.35; }
#pot-root .pot-timeline-wrap{ margin-bottom:20px; }
#pot-root .pot-timeline-title{ font-size:13px; font-weight:600; color:var(--pot-plum); margin-bottom:10px; }
#pot-root .pot-timeline{ display:flex; gap:2px; flex-wrap:wrap; margin-bottom:10px; }
#pot-root .pot-day{ width:22px; height:22px; border-radius:5px; background:var(--pot-neutral); font-size:9px; display:flex; align-items:center; justify-content:center; color:#7A6268; }
#pot-root .pot-day.period{ background:var(--pot-period-bg); color:var(--pot-period); font-weight:700; }
#pot-root .pot-day.fertile{ background:var(--pot-fertile-bg); color:var(--pot-fertile); font-weight:700; }
#pot-root .pot-day.ovulation{ background:var(--pot-ovulation); color:#fff; font-weight:700; }
#pot-root .pot-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#6B4A54; }
#pot-root .pot-legend-item{ display:flex; align-items:center; gap:6px; }
#pot-root .pot-legend-dot{ width:12px; height:12px; border-radius:4px; display:inline-block; }
#pot-root .pot-result-title{ font-family:'Fraunces','Noto Sans Bengali','Noto Sans Devanagari', serif; font-size:18px; color:var(--pot-rose-dark); margin:6px 0 12px; font-weight:600; }
#pot-root .pot-cycle-card{ border:1px solid var(--pot-line); border-radius:10px; padding:14px 16px; margin-bottom:10px; border-left:4px solid var(--pot-rose); }
#pot-root .pot-cycle-head{ font-weight:700; font-size:14px; margin-bottom:6px; }
#pot-root .pot-cycle-row{ font-size:13px; color:#5A4048; line-height:1.6; }
#pot-root .pot-cycle-row b{ color:var(--pot-plum); }
#pot-root .pot-footer-note{ font-size:12px; color:#6B4A54; margin-top:16px; line-height:1.6; border-top:1px dashed var(--pot-line); padding-top:14px; }
@media(max-width:520px){
  #pot-root{padding:20px 14px 30px;}
  #pot-root .pot-grid2{grid-template-columns:1fr;}
  #pot-root .pot-stat-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="pot-root" id="pot-root">

  <div class="pot-eyebrow" id="pot-eyebrow">HEALTH TOOL</div>
  <h1 id="pot-title">Period &amp; Ovulation Tracker</h1>
  <p class="pot-sub" id="pot-subtitle">Enter your last period start date and cycle details to estimate your next period, fertile window, and ovulation day.</p>

  <div class="pot-langbar">
    <button class="pot-lang-btn active" data-lang="en">English</button>
    <button class="pot-lang-btn" data-lang="bn">বাংলা</button>
    <button class="pot-lang-btn" data-lang="hi">हिंदी</button>
  </div>

  <div class="pot-disclaimer" id="pot-disclaimer"></div>

  <div class="pot-card">
    <div class="pot-grid2">
      <div class="pot-field">
        <label id="pot-label-date">Last period start date</label>
        <input id="pot-date" type="date">
      </div>
      <div class="pot-field">
        <label id="pot-label-cycle">Average cycle length (days)</label>
        <input id="pot-cycle" max="45" type="number" value="28">
      </div>
      <div class="pot-field">
        <label id="pot-label-period">Average period length (days)</label>
        <input id="pot-period" max="10" type="number" value="5">
      </div>
    </div>
    <button class="pot-btn" id="pot-calc"><span id="pot-calc-label">Calculate</span></button>
    <div class="pot-msg" id="pot-msg"></div>
  </div>

  <div class="pot-results" id="pot-results">
    <div class="pot-stat-grid">
      <div class="pot-stat">
        <div class="pot-stat-label" id="pot-stat-next-label">Next period</div>
        <div class="pot-stat-value" id="pot-stat-next-value">--</div>
      </div>
      <div class="pot-stat fertile">
        <div class="pot-stat-label" id="pot-stat-fertile-label">Fertile window</div>
        <div class="pot-stat-value" id="pot-stat-fertile-value">--</div>
      </div>
      <div class="pot-stat ovulation">
        <div class="pot-stat-label" id="pot-stat-ovulation-label">Estimated ovulation</div>
        <div class="pot-stat-value" id="pot-stat-ovulation-value">--</div>
      </div>
    </div>

    <div class="pot-timeline-wrap">
      <div class="pot-timeline-title" id="pot-timeline-title">This cycle at a glance</div>
      <div class="pot-timeline" id="pot-timeline"></div>
      <div class="pot-legend">
        <span class="pot-legend-item"><span class="pot-legend-dot" style="background:#FBE9E6;border:1px solid #C24B3F;"></span><span id="pot-legend-period">Period days</span></span>
        <span class="pot-legend-item"><span class="pot-legend-dot" style="background:#E4F1EA;border:1px solid #3E8067;"></span><span id="pot-legend-fertile">Fertile window</span></span>
        <span class="pot-legend-item"><span class="pot-legend-dot" style="background:#B4485B;"></span><span id="pot-legend-ovulation">Ovulation day</span></span>
      </div>
    </div>

    <div class="pot-result-title" id="pot-upcoming-title">Upcoming cycles</div>
    <div id="pot-cycle-list"></div>
  </div>

  <div class="pot-footer-note" id="pot-footer-note"></div>

</div>

<script>
(function(){
  var UI = {
    en:{ eyebrow:"HEALTH TOOL", title:"Period & Ovulation Tracker",
      subtitle:"Enter your last period start date and cycle details to estimate your next period, fertile window, and ovulation day.",
      disclaimer:"This tool gives general estimates using standard cycle-length assumptions. Actual ovulation timing varies by person and by cycle, and irregular cycles can make these estimates less accurate. This is not a method of contraception and does not replace advice from a doctor or gynecologist.",
      labelDate:"Last period start date", labelCycle:"Average cycle length (days)", labelPeriod:"Average period length (days)",
      calc:"Calculate", statNext:"Next period", statFertile:"Fertile window", statOvulation:"Estimated ovulation",
      timelineTitle:"This cycle at a glance", legendPeriod:"Period days", legendFertile:"Fertile window", legendOvulation:"Ovulation day",
      upcomingTitle:"Upcoming cycles", cyclePeriod:"Period", cycleFertile:"Fertile window", cycleOvulation:"Ovulation day", cycleLabel:"Cycle",
      footer:"Estimates assume a consistent cycle length and a typical 14-day luteal phase; real cycles can vary. Track a few cycles for more accurate personal patterns, and consult a doctor if your cycle is very irregular or you have concerns about fertility.",
      needDate:"Please select your last period start date." },
    bn:{ eyebrow:"স্বাস্থ্য টুল", title:"পিরিয়ড ও ওভুলেশন ট্র্যাকার",
      subtitle:"পরবর্তী পিরিয়ড, ফার্টাইল উইন্ডো এবং ওভুলেশন দিন আন্দাজ করতে আপনার শেষ পিরিয়ড শুরুর তারিখ ও সাইকেলের তথ্য দিন।",
      disclaimer:"এই টুলটি সাধারণ ধরে নেওয়া (স্ট্যান্ডার্ড) সাইকেল দৈর্ঘ্যের ভিত্তিতে একটি আনুমানিক হিসাব দেয়। প্রকৃত ওভুলেশনের সময় ব্যক্তিভেদে এবং সাইকেল ভেদে ভিন্ন হতে পারে, এবং অনিয়মিত সাইকেলে এই হিসাব কম নির্ভুল হতে পারে। এটি জন্মনিয়ন্ত্রণের কোনো পদ্ধতি নয় এবং ডাক্তার বা স্ত্রীরোগ বিশেষজ্ঞের পরামর্শের বিকল্প নয়।",
      labelDate:"শেষ পিরিয়ড শুরুর তারিখ", labelCycle:"গড় সাইকেল দৈর্ঘ্য (দিন)", labelPeriod:"গড় পিরিয়ড দৈর্ঘ্য (দিন)",
      calc:"হিসাব করুন", statNext:"পরবর্তী পিরিয়ড", statFertile:"ফার্টাইল উইন্ডো", statOvulation:"আনুমানিক ওভুলেশন",
      timelineTitle:"এই সাইকেলের সংক্ষিপ্ত চিত্র", legendPeriod:"পিরিয়ডের দিন", legendFertile:"ফার্টাইল উইন্ডো", legendOvulation:"ওভুলেশনের দিন",
      upcomingTitle:"আসন্ন সাইকেলসমূহ", cyclePeriod:"পিরিয়ড", cycleFertile:"ফার্টাইল উইন্ডো", cycleOvulation:"ওভুলেশনের দিন", cycleLabel:"সাইকেল",
      footer:"এই হিসাব একটি নির্দিষ্ট সাইকেল দৈর্ঘ্য এবং সাধারণ ১৪ দিনের লুটিয়াল ফেজ ধরে করা হয়েছে; প্রকৃত সাইকেল ভিন্ন হতে পারে। নিজের প্যাটার্ন ভালোভাবে বুঝতে কয়েক মাস ট্র্যাক করুন, এবং সাইকেল খুব অনিয়মিত হলে বা উর্বরতা নিয়ে দুশ্চিন্তা থাকলে ডাক্তারের পরামর্শ নিন।",
      needDate:"অনুগ্রহ করে আপনার শেষ পিরিয়ড শুরুর তারিখ দিন।" },
    hi:{ eyebrow:"हेल्थ टूल", title:"पीरियड और ओव्यूलेशन ट्रैकर",
      subtitle:"अगले पीरियड, फर्टाइल विंडो और ओव्यूलेशन दिन का अनुमान लगाने के लिए अपनी पिछली पीरियड शुरू होने की तारीख और साइकिल की जानकारी दर्ज करें।",
      disclaimer:"यह टूल सामान्य मानी गई (स्टैंडर्ड) साइकिल लंबाई के आधार पर एक अनुमानित हिसाब देता है। असली ओव्यूलेशन का समय व्यक्ति और साइकिल के अनुसार अलग हो सकता है, और अनियमित साइकिल में यह अनुमान कम सटीक हो सकता है। यह गर्भनिरोधक का कोई तरीका नहीं है और डॉक्टर या स्त्री रोग विशेषज्ञ की सलाह का विकल्प नहीं है।",
      labelDate:"पिछली पीरियड शुरू होने की तारीख", labelCycle:"औसत साइकिल लंबाई (दिन)", labelPeriod:"औसत पीरियड लंबाई (दिन)",
      calc:"गणना करें", statNext:"अगला पीरियड", statFertile:"फर्टाइल विंडो", statOvulation:"अनुमानित ओव्यूलेशन",
      timelineTitle:"इस साइकिल का सारांश", legendPeriod:"पीरियड के दिन", legendFertile:"फर्टाइल विंडो", legendOvulation:"ओव्यूलेशन का दिन",
      upcomingTitle:"आने वाली साइकिलें", cyclePeriod:"पीरियड", cycleFertile:"फर्टाइल विंडो", cycleOvulation:"ओव्यूलेशन का दिन", cycleLabel:"साइकिल",
      footer:"यह अनुमान एक स्थिर साइकिल लंबाई और सामान्य 14-दिन के ल्यूटियल फेज़ को मानकर लगाया गया है; असली साइकिल अलग हो सकती है। अपने व्यक्तिगत पैटर्न को बेहतर समझने के लिए कुछ महीनों तक ट्रैक करें, और साइकिल बहुत अनियमित होने या प्रजनन क्षमता को लेकर चिंता होने पर डॉक्टर से सलाह लें।",
      needDate:"कृपया अपनी पिछली पीरियड शुरू होने की तारीख चुनें।" }
  };

  var LOCALE = { en:"en-US", bn:"bn-BD", hi:"hi-IN" };
  var currentLang = "en";
  var lastResult = null;
  var root = document.getElementById("pot-root");

  function fmtDate(d, lang){
    try{ return new Intl.DateTimeFormat(LOCALE[lang], { day:"numeric", month:"short", year:"numeric" }).format(d); }
    catch(e){ return d.toDateString(); }
  }
  function addDays(date, n){ var d = new Date(date.getTime()); d.setDate(d.getDate() + n); return d; }
  function showMessage(msg){ var box = document.getElementById("pot-msg"); box.textContent = msg; box.style.display = "block"; reportHeight(); }
  function clearMessage(){ var box = document.getElementById("pot-msg"); box.textContent = ""; box.style.display = "none"; }

  // Tells the parent Blogger page how tall this widget really is, so the
  // iframe can be resized to match exactly (no gap, no cropping).
  function reportHeight(){
    var h = document.body.scrollHeight;
    window.parent.postMessage({ potTrackerHeight: h }, "*");
  }

  function applyLang(lang){
    currentLang = lang;
    var t = UI[lang];
    document.getElementById("pot-eyebrow").textContent = t.eyebrow;
    document.getElementById("pot-title").textContent = t.title;
    document.getElementById("pot-subtitle").textContent = t.subtitle;
    document.getElementById("pot-disclaimer").textContent = t.disclaimer;
    document.getElementById("pot-label-date").textContent = t.labelDate;
    document.getElementById("pot-label-cycle").textContent = t.labelCycle;
    document.getElementById("pot-label-period").textContent = t.labelPeriod;
    document.getElementById("pot-calc-label").textContent = t.calc;
    document.getElementById("pot-stat-next-label").textContent = t.statNext;
    document.getElementById("pot-stat-fertile-label").textContent = t.statFertile;
    document.getElementById("pot-stat-ovulation-label").textContent = t.statOvulation;
    document.getElementById("pot-timeline-title").textContent = t.timelineTitle;
    document.getElementById("pot-legend-period").textContent = t.legendPeriod;
    document.getElementById("pot-legend-fertile").textContent = t.legendFertile;
    document.getElementById("pot-legend-ovulation").textContent = t.legendOvulation;
    document.getElementById("pot-upcoming-title").textContent = t.upcomingTitle;
    document.getElementById("pot-footer-note").textContent = t.footer;
    root.querySelectorAll(".pot-lang-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });
    clearMessage();
    if(lastResult) render(lastResult);
    reportHeight();
  }
  root.querySelectorAll(".pot-lang-btn").forEach(function(btn){
    btn.onclick = function(){ applyLang(btn.getAttribute("data-lang")); };
  });

  function compute(){
    var t = UI[currentLang];
    var dateVal = document.getElementById("pot-date").value;
    if(!dateVal){ showMessage(t.needDate); return; }
    clearMessage();
    var cycleLen = parseInt(document.getElementById("pot-cycle").value, 10) || 28;
    var periodLen = parseInt(document.getElementById("pot-period").value, 10) || 5;
    var parts = dateVal.split("-");
    var lastStart = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));

    var cycles = [];
    for(var i=0; i<6; i++){
      var cycleStart = addDays(lastStart, i*cycleLen);
      var periodEnd = addDays(cycleStart, periodLen - 1);
      var nextPeriodStart = addDays(cycleStart, cycleLen);
      var ovulation = addDays(nextPeriodStart, -14);
      var fertileStart = addDays(ovulation, -5);
      var fertileEnd = addDays(ovulation, 1);
      cycles.push({ cycleStart:cycleStart, periodEnd:periodEnd, ovulation:ovulation, fertileStart:fertileStart, fertileEnd:fertileEnd, nextPeriodStart:nextPeriodStart, cycleLen:cycleLen, periodLen:periodLen });
    }
    lastResult = cycles;
    render(cycles);
  }

  function render(cycles){
    var t = UI[currentLang];
    var c0 = cycles[0];

    document.getElementById("pot-stat-next-value").textContent = fmtDate(c0.nextPeriodStart, currentLang);
    document.getElementById("pot-stat-fertile-value").textContent = fmtDate(c0.fertileStart, currentLang) + " - " + fmtDate(c0.fertileEnd, currentLang);
    document.getElementById("pot-stat-ovulation-value").textContent = fmtDate(c0.ovulation, currentLang);

    var timeline = document.getElementById("pot-timeline");
    timeline.innerHTML = "";
    for(var d=0; d<c0.cycleLen; d++){
      var day = addDays(c0.cycleStart, d);
      var cell = document.createElement("div");
      cell.className = "pot-day";
      if(d < c0.periodLen){ cell.classList.add("period"); }
      if(day >= c0.fertileStart && day <= c0.fertileEnd){ cell.classList.add("fertile"); }
      if(day.getTime() === c0.ovulation.getTime()){ cell.classList.add("ovulation"); cell.classList.remove("fertile"); }
      cell.textContent = d+1;
      timeline.appendChild(cell);
    }

    var list = document.getElementById("pot-cycle-list");
    list.innerHTML = "";
    cycles.forEach(function(cy, idx){
      var card = document.createElement("div");
      card.className = "pot-cycle-card";
      card.innerHTML =
        '<div class="pot-cycle-head">'+t.cycleLabel+' '+(idx+1)+'</div>' +
        '<div class="pot-cycle-row"><b>'+t.cyclePeriod+':</b> '+fmtDate(cy.cycleStart, currentLang)+' - '+fmtDate(cy.periodEnd, currentLang)+'</div>' +
        '<div class="pot-cycle-row"><b>'+t.cycleFertile+':</b> '+fmtDate(cy.fertileStart, currentLang)+' - '+fmtDate(cy.fertileEnd, currentLang)+'</div>' +
        '<div class="pot-cycle-row"><b>'+t.cycleOvulation+':</b> '+fmtDate(cy.ovulation, currentLang)+'</div>';
      list.appendChild(card);
    });

    document.getElementById("pot-results").classList.add("show");
    reportHeight();
  }

  document.getElementById("pot-calc").onclick = function(){
    compute();
    reportHeight();
  };

  applyLang("en");
  // Report a first height on load, and again after fonts/images settle.
  window.addEventListener("load", reportHeight);
  setTimeout(reportHeight, 300);
  setTimeout(reportHeight, 1000);
})();
</script>

</body>
</html>
